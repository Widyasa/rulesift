[package]
name = "rulesift"
description = "Offline, zero-cost linter and PR gate for AI agent configuration (skills, rules, MCP configs, hooks)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["security", "linter", "mcp", "agents", "sarif"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "rulesift"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
owo-colors = "4.4.0"
rulesift-core = { path = "../rulesift-core", version = "0.0.1" }

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.49.0"
predicates = "3.1.4"
tempfile = "3.27.0"
