[package]
name = "rulesift-core"
description = "Core library of RuleSift: offline linter for AI agent configuration files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["security", "linter", "mcp", "agents", "sarif"]
categories = ["development-tools"]

[dependencies]
aho-corasick = "1.1.5"
comrak = { version = "0.55.0", default-features = false }
gix = { version = "0.90.0", default-features = false, features = ["revision", "sha1"] }
globset = "0.4.21"
ignore = "0.4.34"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
serde-sarif = "0.8.0"
serde_json = "1.0.154"
sha2 = "0.11.1"
similar = "3.2.1"
thiserror = "2.0.21"
toml = "1.1.8"

[dev-dependencies]
insta = "1.49.0"
jsonschema = { version = "0.60.2", default-features = false }
tempfile = "3.27.0"
