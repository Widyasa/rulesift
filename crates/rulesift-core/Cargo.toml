[package]
name = "rulesift-core"
description = "Core library of RuleSift: offline linter for AI agent configuration files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[dependencies]
globset = "0.4.21"
ignore = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"
