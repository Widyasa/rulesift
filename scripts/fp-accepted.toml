# Config for scripts/fp-check.sh. Built-in defaults plus the findings we
# reviewed and accept as true positives in the pinned corpus (see
# docs/false-positives.md). These are suppressions for the corpus only; the
# rules still flag the same lines in your repo.

[[suppress]]
rule = "RS-EXEC-001"
path = "skills/.curated/sentry/SKILL.md"
reason = "openai/skills: vendor CLI installer (cli.sentry.dev) piped to bash; true positive, accepted for the FP corpus"

