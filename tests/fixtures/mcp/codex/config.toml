# Codex project config (loaded only for trusted projects)
model = "example-model"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[mcp_servers.docs]
command = "npx"
args = ["-y", "@example/docs-mcp@1.2.3"]

[mcp_servers.docs.env]
DOCS_TOKEN = "${DOCS_TOKEN}"

[mcp_servers.remote]
url = "https://mcp.x.example/mcp"
bearer_token_env_var = "REMOTE_TOKEN"
http_headers = { "X-Client" = "codex" }
