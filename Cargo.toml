[workspace]
resolver = "2"
members = ["crates/rulesift-core", "crates/rulesift"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Widyasa/rulesift"
homepage = "https://github.com/Widyasa/rulesift"
authors = ["Widya Yasa"]

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
